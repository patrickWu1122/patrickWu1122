<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="構圖教練">
<meta name="theme-color" content="#0d0d0f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>構圖教練 Live</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Inter+Tight:wght@600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: a pro camera's live view with a quiet coach
   IDEA: mirrorless camera back screen — black housing, focus-confirm green, guide yellow
   PICTURE: the live viewfinder itself, full width, with target ring, arrow and horizon guides
   COLOUR and TYPE: black #0d0d0f, warm white, guide yellow #ffd23f, confirm green #4ade80; Inter Tight numbers, Noto Sans TC
   LAYOUT: mode switch on top, viewfinder, shutter row, then training panel */
:root{color-scheme:dark;--bg:#0d0d0f;--pan:#18181c;--line:#2a2a30;--ink:#f3f1ec;--dim:#9a9aa3;--acc:#ffd23f;--ok:#4ade80;--bad:#ff5a4e}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Noto Sans TC",system-ui,sans-serif;overflow-x:clip;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.num{font-family:"Inter Tight",system-ui,sans-serif;font-variant-numeric:tabular-nums}
.wrap{max-width:1100px;margin:0 auto;padding:10px 14px 40px;display:grid;gap:14px}
@media(min-width:900px){.wrap{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);align-items:start}.vf{position:sticky;top:10px}}
.top{display:flex;gap:10px;align-items:center;justify-content:space-between;grid-column:1/-1}
h1{font-size:18px;margin:0}h1 b{color:var(--acc)}
.seg{display:flex;background:var(--pan);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{appearance:none;border:0;background:none;color:var(--dim);font:700 16px "Noto Sans TC";min-height:40px;padding:0 18px;border-radius:9px;cursor:pointer}
.seg button.on{background:var(--acc);color:#111}
.stage{position:relative;background:#000;border-radius:14px;overflow:hidden;aspect-ratio:3/4;display:grid;place-items:center}
.stage video,.stage canvas.still{max-width:100%;max-height:100%;display:block}
#ov{position:absolute;pointer-events:none}
.empty{text-align:center;color:var(--dim);padding:24px}
.badge{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.6);padding:4px 12px;border-radius:20px;font-size:18px;font-weight:700}
.status{position:absolute;top:10px;left:10px;background:rgba(0,0,0,.6);padding:4px 10px;border-radius:20px;font-size:13px;color:var(--dim)}
.guide{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:rgba(0,0,0,.7);padding:8px 14px;border-radius:12px;font-weight:700;font-size:16px;white-space:nowrap;max-width:94%;overflow:hidden;text-overflow:ellipsis}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.row>*{flex:1}
.btn{appearance:none;border:1px solid var(--line);background:var(--pan);color:var(--ink);font:500 16px "Noto Sans TC";min-height:46px;padding:10px 14px;border-radius:12px;cursor:pointer;text-align:center}
.btn.pri{background:var(--acc);color:#111;border-color:var(--acc);font-weight:700}
.btn:focus-visible,.seg button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.shutter{flex:0 0 72px;height:72px;border-radius:50%;border:4px solid #fff;background:#fff3;padding:0}
.shutter.ready{background:var(--ok);border-color:#d9ffe6}
.panel{background:var(--pan);border:1px solid var(--line);border-radius:14px;padding:16px}
h2{font-size:16px;margin:0 0 8px}
.tips{list-style:none;padding:0;margin:10px 0 0;display:grid;gap:8px}
.tips li{padding:9px 12px;border-radius:10px;background:#222228;font-size:15px;border-left:3px solid var(--acc)}
.tips li.bad{border-left-color:var(--bad)}.tips li.hd{background:none;border:0;padding:6px 0 0;font-weight:700;color:var(--dim);font-size:14px}.tips li b{display:block;font-weight:700}.tips li small{display:block;color:var(--dim);font-size:13px;margin-top:2px}.tips li.good{border-left-color:var(--ok)}
.hint{color:var(--dim);font-size:13px;margin:6px 0 0}
.train{display:grid;grid-template-columns:120px minmax(0,1fr);gap:14px;align-items:center}
.train canvas{width:120px;height:160px;border-radius:8px;background:#000}
.big{font-size:34px;font-weight:700;line-height:1}
.prog{height:6px;background:#2a2a30;border-radius:3px;overflow:hidden;margin-top:8px}.prog i{display:block;height:100%;width:0;background:var(--acc)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:14px;margin-top:8px}.kv span:nth-child(odd){color:var(--dim)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;place-items:center;padding:20px;z-index:9;text-align:center}
.modal.show{display:grid}.modal img{max-width:100%;max-height:70vh;border-radius:10px}
.rec{display:flex;align-items:center;gap:10px;margin-top:10px}.rec span{color:var(--dim);font-size:14px;white-space:nowrap}.rec select{flex:1;min-height:46px;font:500 16px 'Noto Sans TC';background:var(--pan);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:0 12px}
.steps{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.steps span{background:#24242a;border-radius:20px;padding:4px 10px;font-size:13px}.credit{color:var(--dim);font-size:12px;margin-top:6px}.credit a{color:var(--dim)}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="wrap">
 <div class="top"><h1>構圖<b>教練</b> Live</h1>
  <div class="seg" role="tablist"><button id="mP" class="on">人像</button><button id="mL">風景</button></div></div>

 <section class="vf">
  <div class="stage" id="stage">
   <div class="empty" id="empty">按「開始取景」打開相機<br><small>或用「分析照片」先試試看</small></div>
   <video id="vid" class="hidden" playsinline muted></video>
   <canvas id="still" class="still hidden"></canvas>
   <canvas id="ov"></canvas>
   <div class="status" id="status">載入偵測模型中…</div>
   <div class="badge num hidden" id="badge"></div>
   <div class="guide hidden" id="guide"></div>
  </div>
  <div class="row" style="align-items:center">
   <button class="btn pri" id="startBtn">開始取景</button>
   <button class="shutter" id="shutter" aria-label="拍攝"></button>
   <label class="btn">分析照片<input id="testIn" type="file" accept="image/*" capture="environment" hidden></label>
  </div>
  <div class="row"><button class="btn" id="levelBtn">開啟水平儀</button><button class="btn" id="flipBtn">切換前／後鏡頭</button></div>
  <label class="rec" id="recBox"><span>拍法</span><select id="recSel"></select></label>
  <div class="steps" id="steps"></div>
  <p class="hint" id="note"></p>
 </section>

 <section>
  <div class="panel">
   <h2 id="tipT">即時建議・人像</h2>
   <ul class="tips" id="tips"><li>開始取景後，這裡會即時更新建議。</li></ul>
  </div>
  <div class="panel" style="margin-top:14px">
   <h2 id="trT">訓練：人像模型</h2>
   <div class="train">
    <canvas id="heat" width="120" height="160"></canvas>
    <div><div class="big num" id="trN">0</div><div class="hint" style="margin:0">張參考照片</div>
     <div class="kv" id="trKV"></div></div>
   </div>
   <div class="prog"><i id="trBar"></i></div>
   <div class="row">
    <label class="btn pri">加入參考照片<input id="trIn" type="file" accept="image/*" multiple hidden></label>
    <button class="btn" id="trClr">清除此模型</button>
   </div>
   <p class="hint" id="trHint">選一批你覺得構圖好的人像照片（建議 20 張以上）。系統會學這些照片的眼睛高度、臉部位置和人物大小；照片越多，建議越像你要的風格。人像和風景分開訓練。</p>
  </div>
 </section>
</div>
<div class="modal" id="modal"><div><img id="outImg" alt="拍攝成品"><p>長按圖片 →「加入照片」存到相簿</p><button class="btn" id="closeM">繼續拍</button></div></div>

<script type="module">
const $=id=>document.getElementById(id);
const vid=$('vid'),ov=$('ov'),oc=ov.getContext('2d'),still=$('still');
const P3=[1/3,2/3];
let mode='portrait',stream=null,facing='environment',face=null,pose=null,running=false,tilt=null,frameSrc=null;


const RECIPES={
 auto:{n:'自動判斷',steps:[]},
 legs:{n:'網美長腿（全身）',eyeY:1/3,footY:.94,steps:['手機放到腰部或膝蓋高度','鏡頭微微往上仰','用 1x 或 0.5x，腳尖貼近畫面底部','頭頂上方留一點天空']},
 center:{n:'置中全身',eyeY:1/3,footY:.9,off:0,steps:['手機在主角胸口高度','用 1.5x 變焦','站在 4 公尺以外','主角的頭放在畫面正中線上']},
 thirds:{n:'三分法人像',eyeY:1/3,off:1/6,steps:['手機在主角胸口高度','用 2x 變焦，站 4 公尺以外','頭放在上方三分線上']},
 tele:{n:'半身特寫',eyeY:1/3,off:0,steps:['退到 4 公尺以外，用 3x 變焦','背景會被壓縮得很乾淨、有雜誌感','頭放在上方三分線上']},
 env:{n:'環境人像',eyeY:1/3,off:.22,steps:['退到 8 公尺以外，用 3–4x','主角放在畫面一側','另一側留給場景說故事']}};
let recipe='auto';try{recipe=localStorage.getItem('fc_recipe')||'auto'}catch(e){}
/* ---------- learned models (per mode, stored on this device) ---------- */
const KEY='fc_models_v1';
let M={portrait:{s:[]},landscape:{s:[]}};
try{const v=JSON.parse(localStorage.getItem(KEY));if(v&&v.portrait&&v.landscape)M=v}catch(e){}
const saveM=()=>{try{localStorage.setItem(KEY,JSON.stringify(M))}catch(e){}};
const mean=a=>a.reduce((x,y)=>x+y,0)/a.length;
function learned(){const s=M[mode].s;
 if(mode==='portrait'){const d={eyeY:1/3,off:1/6,size:.18,footY:.93,n:s.length};const fs=s.filter(o=>o.footY!=null);if(fs.length>=3)d.footY=mean(fs.map(o=>o.footY));if(s.length>=3){d.eyeY=mean(s.map(o=>o.eyeY));d.off=mean(s.map(o=>Math.abs(o.x-.5)));d.size=mean(s.map(o=>o.size))}const R=RECIPES[recipe];if(R&&recipe!=='auto'){for(const k of ['eyeY','footY','off'])if(R[k]!=null)d[k]=R[k]}return d}
 const d={low:2/3,high:1/3,pLow:.5,sx:1/3,n:s.length};if(s.length>=3){const hs=s.map(o=>o.hy).filter(v=>v!=null),lo=hs.filter(v=>v>=.5),hi=hs.filter(v=>v<.5);if(lo.length)d.low=mean(lo);if(hi.length)d.high=mean(hi);d.pLow=hs.length?lo.length/hs.length:.5;const xs=s.map(o=>Math.abs(o.sx-.5));d.sx=.5-mean(xs)}return d}

/* ---------- detectors: MediaPipe when reachable, otherwise built-in heuristics ---------- */
let mpOK=false;
(async()=>{try{const V=await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14');
 const fs=await V.FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
 face=await V.FaceLandmarker.createFromOptions(fs,{baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task',delegate:'GPU'},runningMode:'VIDEO',numFaces:3});
 pose=await V.PoseLandmarker.createFromOptions(fs,{baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task',delegate:'GPU'},runningMode:'VIDEO',numPoses:1});
 mpOK=true;$('status').textContent='AI 人臉＋骨架偵測：已啟用'}
 catch(e){$('status').textContent='簡易偵測模式（膚色＋對比）';$('note').textContent='這個環境載不到 AI 偵測模型，目前用簡易偵測。放到自己的網址開啟，就會自動啟用人臉＋骨架偵測。'}})();
let ts=0;const nextTs=()=>(ts=Math.max(ts+1,performance.now()));
async function setMode(m){if(face){await face.setOptions({runningMode:m});await pose.setOptions({runningMode:m})}}

function lumGrid(src,W){const H=Math.round(W*(src.videoHeight||src.height)/(src.videoWidth||src.width)),c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(src,0,0,W,H);return{W,H,d:x.getImageData(0,0,W,H).data}}
const L=(d,i)=>(.2126*d[i]+.7152*d[i+1]+.0722*d[i+2])/255;

/* face via MediaPipe or skin heuristic */
function detectPeople(src,isImage){const g=lumGrid(src,160);let f=null,kp=null;
 if(mpOK){try{const r=isImage?face.detect(src):face.detectForVideo(src,nextTs());if(r.faceLandmarks.length){let best=null,ba=0;for(const lm of r.faceLandmarks){let x0=1,x1=0,y0=1,y1=0;for(const p of lm){x0=Math.min(x0,p.x);x1=Math.max(x1,p.x);y0=Math.min(y0,p.y);y1=Math.max(y1,p.y)}const a=(x1-x0)*(y1-y0);if(a>ba){ba=a;best={lm,x0,x1,y0,y1}}}
   const lm=best.lm,le=lm[33],re=lm[263],no=lm[1],em={x:(le.x+re.x)/2,y:(le.y+re.y)/2},ed=Math.hypot(re.x-le.x,re.y-le.y)||.01;
   f={cx:(best.x0+best.x1)/2,cy:(best.y0+best.y1)/2,eyeY:em.y,top:best.y0-(best.y1-best.y0)*.25,h:best.y1-best.y0,x0:best.x0,x1:best.x1,yaw:(no.x-em.x)/ed,roll:Math.atan2(re.y-le.y,re.x-le.x)*57.3,n:r.faceLandmarks.length}}
  const pr=isImage?pose.detect(src):pose.detectForVideo(src,nextTs());if(pr.landmarks.length)kp=pr.landmarks[0]}catch(e){}}
 if(!f&&!mpOK){const{W,H,d}=g,pts=[];for(let y=0;y<H;y++)for(let x=0;x<W;x++){const i=(y*W+x)*4,Y=.299*d[i]+.587*d[i+1]+.114*d[i+2],cb=128-.1687*d[i]-.3313*d[i+1]+.5*d[i+2],cr=128+.5*d[i]-.4187*d[i+1]-.0813*d[i+2];if(Y>45&&cb>77&&cb<127&&cr>138&&cr<173)pts.push([x,y])}
  if(pts.length>W*H*.01){const cell={};for(const[x,y]of pts){const k=(x>>3)+','+(y>>3);(cell[k]=cell[k]||[]).push([x,y])}let best=null,bv=0;for(const k in cell){const[a,b]=k.split(',').map(Number);let v=0,q=[];for(let i=-2;i<=2;i++)for(let j=-2;j<=2;j++){const c=cell[(a+i)+','+(b+j)];if(c){v+=c.length;q=q.concat(c)}}if(v>bv){bv=v;best=q}}
   let x0=W,x1=0,y0=H,y1=0;for(const[x,y]of best){x0=Math.min(x0,x);x1=Math.max(x1,x);y0=Math.min(y0,y);y1=Math.max(y1,y)}const h=Math.min(y1-y0,(x1-x0)*1.4);
   f={cx:(x0+x1)/2/W,cy:(y0+h/2)/H,eyeY:(y0+h*.42)/H,top:(y0-h*.2)/H,h:h/H,x0:x0/W,x1:x1/W,yaw:0,roll:0,n:1}}}
 // lighting on face
 let light=null;{const{W,H,d}=g;let all=0;for(let i=0;i<d.length;i+=4)all+=L(d,i);all/=W*H;
  if(f){let l=0,r=0,nl=0,nr=0;const ya=Math.max(0,f.cy-f.h/2)*H|0,yb=Math.min(H-1,(f.cy+f.h/2)*H)|0,xa=Math.max(0,f.x0*W)|0,xb=Math.min(W-1,f.x1*W)|0,xm=(xa+xb)/2;for(let y=ya;y<=yb;y++)for(let x=xa;x<=xb;x++){const v=L(d,(y*W+x)*4);if(x<xm){l+=v;nl++}else{r+=v;nr++}}l/=nl||1;r/=nr||1;light={face:(l+r)/2,lr:r-l,bg:all}}
  else light={face:all,lr:0,bg:all}}
 const ar=(src.videoWidth||src.width)/(src.videoHeight||src.height);return{f,kp,light,aspect:ar}}

/* landscape: horizon line + tilt + salient point */
function detectScene(src){const{W,H,d}=lumGrid(src,160),lum=new Float32Array(W*H);let all=0,hi=0;for(let i=0;i<W*H;i++){lum[i]=L(d,i*4);all+=lum[i];if(lum[i]>.97)hi++}all/=W*H;
 const ys=[],xs=[];for(let x=4;x<W-4;x+=4){let by=-1,bv=0;for(let y=Math.floor(H*.12);y<H*.88;y++){let v=0;for(let k=-1;k<=1;k++)v+=lum[(y-2)*W+x+k]+lum[(y-1)*W+x+k]-lum[(y+1)*W+x+k]-lum[(y+2)*W+x+k];if(v>bv){bv=v;by=y}}if(bv>.35){xs.push(x);ys.push(by)}}
 let hy=null,ang=0;if(xs.length>W/10){// robust line fit: drop outliers vs median
  const med=[...ys].sort((a,b)=>a-b)[ys.length>>1],kx=[],ky=[];xs.forEach((x,i)=>{if(Math.abs(ys[i]-med)<H*.12){kx.push(x);ky.push(ys[i])}});
  if(kx.length>xs.length*.5){const mx=mean(kx),my=mean(ky);let sxy=0,sxx=0;kx.forEach((x,i)=>{sxy+=(x-mx)*(ky[i]-my);sxx+=(x-mx)**2});const sl=sxx?sxy/sxx:0;ang=Math.atan(sl)*57.3;hy=(my+sl*(W/2-mx))/H}}
 // sky texture above horizon
 let skyTex=0,skyL=0;if(hy){const yb=Math.max(2,hy*H-3)|0;let n=0,m=0;for(let y=1;y<yb;y++)for(let x=1;x<W-1;x++){skyTex+=Math.abs(lum[y*W+x]-lum[y*W+x-1])+Math.abs(lum[y*W+x]-lum[(y-1)*W+x]);m+=lum[y*W+x];n++}skyTex/=n||1;skyL=m/(n||1)}
 // salient point: local contrast weighted, ignoring the top band
 let wx=0,wy=0,ws=0;for(let y=2;y<H-2;y++)for(let x=2;x<W-2;x++){const v=Math.abs(lum[y*W+x]-all),c=Math.abs(lum[y*W+x+2]-lum[y*W+x-2])+Math.abs(lum[(y+2)*W+x]-lum[(y-2)*W+x]),w=(v*c)**2;wx+=x*w;wy+=y*w;ws+=w}
 return{hy,ang,skyTex,skyL,all,hi:hi/(W*H),sx:ws?wx/ws/W:.5,sy:ws?wy/ws/H:.5}}

/* ---------- guidance ---------- */
/*PURE*/
const THR={"feetCut": 0.95, "kneeLo": 0.95, "hipLo": 0.88, "headCut": -0.02, "footTol": 0.1, "tooSmall": 0.35, "legLow": 1, "legHigh": 2.6, "eyeLowTol": 0.1, "eyeHighTol": 0.14, "posTol": 0.13, "square": 0.69, "kneeStraight": 170, "elbowStraight": 148, "legNice": 1.45, "yaw": 0.35, "roll": 12};
const ANG={"hi": {"w": [-5.4334, -1.0141, -4.164], "b": 0.983, "t": 0.3, "soft": -1.832}, "lo": {"w": [3.4129, 1.4149, 1.9116], "b": -4.3106, "t": 2.2}};/*ANG*/ /*THR — tuned on 19,945 COCO real-photo skeletons, see train/*/
const vis=(kp,i)=>kp&&kp[i]&&kp[i].visibility>.5&&kp[i].y>-.02&&kp[i].y<1.02&&kp[i].x>-.02&&kp[i].x<1.02;
const ang3=(a,b,c)=>{const v1=[a.x-b.x,a.y-b.y],v2=[c.x-b.x,c.y-b.y];return Math.acos(Math.max(-1,Math.min(1,(v1[0]*v2[0]+v1[1]*v2[1])/(Math.hypot(...v1)*Math.hypot(...v2)||1))))*57.3};
// returns a list of concrete actions {k,who,act,why,p}; p = priority (higher first)
function advisePortrait(r,lm){const out=[],add=(k,who,act,why,p)=>out.push({k,who,act,why,p});const{f,kp,light}=r;
 if(!f&&!kp){add('none','cam','把主角放進畫面','還找不到人，請讓主角的臉朝向鏡頭',99);return{list:out,shot:null}}
 const has=i=>vis(kp,i);let shot='close';
 if(kp){if(has(27)||has(28))shot='full';else if(has(25)||has(26))shot='knee';else if(has(23)||has(24))shot='half'}
 else if(f&&f.h<.12)shot='full';else if(f&&f.h<.22)shot='half';
 const avgY=(a,b)=>has(a)&&has(b)?(kp[a].y+kp[b].y)/2:has(a)?kp[a].y:has(b)?kp[b].y:null;

$('trClr').onclick=()=>{M[mode].s=[];saveM();renderTrain();$('trBar').style.width='0'};
function renderTrain(){const s=M[mode].s,lm=learned(),h=$('heat'),x=h.getContext('2d');$('trN').textContent=s.length;$('trT').textContent='訓練：'+(mode==='portrait'?'人像模型':'風景模型');
 x.fillStyle='#000';x.fillRect(0,0,120,160);x.strokeStyle='rgba(255,255,255,.25)';x.beginPath();for(const p of P3){x.moveTo(120*p,0);x.lineTo(120*p,160);x.moveTo(0,160*p);x.lineTo(120,160*p)}x.stroke();
 if(mode==='portrait'){x.fillStyle='rgba(255,210,63,.35)';for(const o of s){x.beginPath();x.arc(o.x*120,o.eyeY*160,4,0,7);x.fill()}x.strokeStyle='#4ade80';x.beginPath();x.moveTo(0,lm.eyeY*160);x.lineTo(120,lm.eyeY*160);x.stroke();
  $('trKV').innerHTML=`<span>眼睛高度</span><span class="num">${Math.round(lm.eyeY*100)}%</span><span>離中心</span><span class="num">${Math.round(lm.off*100)}%</span><span>臉部大小</span><span class="num">${Math.round(lm.size*100)}%</span><span>全身腳位</span><span class="num">${Math.round(lm.footY*100)}%</span><span>來源</span><span>${s.length>=3?'你的訓練照片':'內建網美拍法'}</span>`;
  $('trHint').textContent=s.length?$('trHint').textContent:'選一批你覺得構圖好的人像照片（建議 20 張以上）。系統會學這些照片的眼睛高度、臉部位置和人物大小；照片越多，建議越像你要的風格。'}
 else{x.strokeStyle='rgba(255,210,63,.4)';for(const o of s)if(o.hy!=null){x.beginPath();x.moveTo(0,o.hy*160);x.lineTo(120,o.hy*160);x.stroke()}x.fillStyle='rgba(255,255,255,.5)';for(const o of s){x.beginPath();x.arc(o.sx*120,o.sy*160,2.5,0,7);x.fill()}
  $('trKV').innerHTML=`<span>低地平線</span><span class="num">${Math.round(lm.low*100)}%</span><span>高地平線</span><span class="num">${Math.round(lm.high*100)}%</span><span>偏好低線</span><span class="num">${Math.round(lm.pLow*100)}%</span><span>來源</span><span>${s.length>=3?'你的訓練照片':'內建三分法規則'}</span>`;
  if(!s.length)$('trHint').textContent='選一批你喜歡的風景照片。系統會學地平線放多高、主體放在哪裡。和人像模型分開訓練。'}}

/* mode switch */
function setUIMode(m){mode=m;$('mP').classList.toggle('on',m==='portrait');$('mL').classList.toggle('on',m==='landscape');$('tipT').textContent='即時建議・'+(m==='portrait'?'人像':'風景');$('recBox').classList.toggle('hidden',m!=='portrait');$('steps').classList.toggle('hidden',m!=='portrait');$('trBar').style.width='0';renderTrain();
 if(!running&&!still.classList.contains('hidden')){const g=m==='portrait'?guidePortrait(detectPeople(still,true)):guideLand(detectScene(still));show(g);draw(still,g,false)}}
$('mP').onclick=()=>setUIMode('portrait');$('mL').onclick=()=>setUIMode('landscape');
function renderRecipe(){const R=RECIPES[recipe];$('steps').innerHTML=R.steps.map((t,i)=>`<span>${i+1}. ${t}</span>`).join('')+(recipe!=='auto'&&recipe!=='legs'?'<div class="credit" style="flex-basis:100%">拍法參考 <a href="https://www.slaycamera.com/" target="_blank" rel="noopener">slay composition guides</a>（CC BY 4.0）</div>':'')}
$('recSel').innerHTML=Object.entries(RECIPES).map(([k,v])=>`<option value="${k}" ${k===recipe?'selected':''}>${v.n}</option>`).join('');
$('recSel').onchange=e=>{recipe=e.target.value;try{localStorage.setItem('fc_recipe',recipe)}catch(err){}renderRecipe();renderTrain()};
renderTrain();renderRecipe();
</script>
<script>if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});</script>
</body>
